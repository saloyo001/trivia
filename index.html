<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="quiz-box">
        <h1>Trivia Quiz</h1>
        <p>Answer the questions before time runs out!</p>

        <p id="timer">Time: 60 seconds</p>
        <p id="score">Score: 0</p>

        <div id="quiz">
            <p>Click the button to start your quiz.</p>
        </div>

        <button id="start-button">Start Quiz</button>
        <button id="answer-button" hidden>Submit Answer</button>
        <button id="next-button" hidden>Next Question</button>
        <button id="restart-button" hidden>Play Again</button>

        <p id="feedback"></p>
    </div>

</body>
</html>
